name: Release

on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-rc.') && 'npm-prerelease' || 'npm-production' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm run contracts:generate
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run docs:build
      - run: pnpm run api:check
      - name: Pack packages
        run: |
          mkdir -p artifacts
          pnpm -r --filter './packages/*' pack --pack-destination artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: artifacts/*.tgz
      - name: Publish npm packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then TAG=next; else TAG=latest; fi
          pnpm -r --filter './packages/*' publish --access public --tag "$TAG" --provenance --no-git-checks
