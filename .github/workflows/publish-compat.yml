name: Publish old-scope compatibility packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm compat:pack
      - run: pnpm -r --filter './compat/*' publish --access public --tag latest --provenance --no-git-checks
