name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm contracts:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm api:check
      - run: pnpm pack:dry
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm docs:build
        if: matrix.node-version == 22
