<!doctype html>
<html><head><meta charset="utf-8"><title>U-net plain HTML login</title></head><body>
<button id="login">Sign in with U-net</button><pre id="out"></pre>
<script type="module">
import { createDirectProviderLogin, waitForDirectProviderLogin, renderDirectLoginQrPayload } from '../../packages/web-login/src/index.ts';
const out = document.getElementById('out');
document.getElementById('login').onclick = async () => {
  const session = await createDirectProviderLogin(window.location.origin);
  out.textContent = renderDirectLoginQrPayload(session);
  const result = await waitForDirectProviderLogin(window.location.origin, session.requestRef);
  out.textContent = JSON.stringify(result, null, 2);
};
</script></body></html>
